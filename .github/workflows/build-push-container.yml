name: Build, Sign, and Push Container

# Manual trigger only — run from the Actions tab.
# Later you can add `push:` or `release:` triggers when you trust the flow.
on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra tag to apply (optional — git SHA is always tagged)"
        required: false
        type: string
      push:
        description: "Push to registry? (uncheck to dry-run the build)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write      # push to GHCR
  id-token: write      # OIDC token for cosign keyless + attestations
  attestations: write  # GitHub's native SLSA attestations

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase; repo owner is "PluralisResearch" so we pin the literal.
  IMAGE_NAME: pluralisresearch/agora

jobs:
  build-sign-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign (keyless)
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Job summary
        run: |
          {
            echo "### Build result"
            echo ""
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "- **Pushed:** \`${{ inputs.push }}\`"
            echo "- **Tags:**"
            echo '${{ steps.meta.outputs.tags }}' | sed 's|^|  - `|;s|$|`|'
          } >> "$GITHUB_STEP_SUMMARY"